# Strativis web app on GitHub Pages: the same app in any browser, installable
# on iPhone and iPad with Share > Add to Home Screen. No Apple account needed.
# Once: repository Settings > Pages > Source: GitHub Actions.
name: Web app

on:
  push:
    branches: [main, master]
    paths:
      - "app/src/main/assets/www/**"
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Build the site
        run: Rscript web/build_site.R site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
